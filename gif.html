<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Full Screen GIF</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black; /* optional */
      overflow: hidden;
    }

    .container {
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="17.gif" alt="GIF" />
  </div>
</body>
</html>
