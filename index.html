<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>intro</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;

      height: 100vh;
      object-fit: cover;
    }

</head>

<body>
  <div class="container">
    <video id="introVideo" autoplay muted playsinline>
      <source src="171.mp4" type="video/mp4">
      <source src="17.webm" type="video/webm">
      Your browser does not support the video tag.
    </video>
  </div>

  <script>
    const video = document.getElementById("introVideo");

    video.addEventListener("ended", () => {
      window.location.href = "1st.html";
    });
  </script>

</html>
